spring.application.name=transaction-service
server.port=${TRANSACTION_SERVICE_PORT:8083}

# These references point to the existing TimeSheetDB; this service never owns
# user, project, or employee-project master data.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/TimeSheetDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates only the new transaction tables when a fresh database is used.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Must be identical to the secret used by Auth and Business services.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=}
