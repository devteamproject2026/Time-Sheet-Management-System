# ==========================================
# Business Service
# ==========================================
spring.application.name=business-service
server.port=8082

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/TimeSheetDB
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

# Database tables are already created by the SQL script.
# Do not allow this service to change the schema automatically.
spring.jpa.hibernate.ddl-auto=none

# Display SQL queries for development and learning.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT Security
# ==========================================

# Auth Service signs the login token and Business Service verifies it.
# Both services must use exactly the same secret. JWT_SECRET can override this
# development value when the application is deployed.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=}
