spring.application.name=work-plus-ai-service
server.port=${AI_SERVICE_PORT:8084}
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
# Use the stable local hostname instead of a VPN or virtual-adapter IP.
eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=false

# Must match Auth Service, Gateway, Business Service and Transaction Service.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=}

# Set the real key only as an environment variable in STS. Never commit it.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# Do not expose internal stack traces in API responses.
server.error.include-stacktrace=never
