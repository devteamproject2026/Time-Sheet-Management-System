spring.application.name=auth-service

# ==========================================
# Application Configuration
# ==========================================


server.port=${AUTH_SERVICE_PORT:8081}

# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/TimeSheetDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Logging
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# JWT Configuration
# ==========================
# Local defaults keep beginner setup simple. In deployment, provide the same
# strong JWT_SECRET to Auth, Gateway, Business, and Transaction services.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Keep false for local HTTP. Set COOKIE_SECURE=true when deployed with HTTPS.
app.cookie.secure=${COOKIE_SECURE:false}


eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true


