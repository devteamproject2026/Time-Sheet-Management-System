spring.application.name=work-plus-api-gateway
server.port=${API_GATEWAY_PORT:8080}

# The Gateway uses Eureka to locate service instances. Explicit routes keep the
# public API paths clear and avoid exposing automatic /service-name/** routes.
spring.cloud.discovery.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=business-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://business-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/business/**

spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transactions/**

eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

# Only the Gateway communicates with the browser, so it owns the CORS policy.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Auth Service signs the JWT; Gateway and downstream services verify it with
# this identical Base64 secret. Deployment must provide JWT_SECRET securely.
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ1RoYXRNdXN0QmVBdExlYXN0MzJCeXRlc0xvbmc=}
